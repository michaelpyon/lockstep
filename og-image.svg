  <rect x="0" y="600" width="1200" height="6" fill="#6b8eff"/>
  <text x="80" y="280" font-family="'Segoe UI', Tahoma, sans-serif" font-size="120" font-weight="800" fill="#ffffff" letter-spacing="12">LOCKSTEP</text>
  <text x="80" y="340" font-family="'Segoe UI', Tahoma, sans-serif" font-size="36" font-weight="400" fill="#aaaadd">March to the beat</text>
  <text x="80" y="510" font-family="'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="500" fill="#8888cc" letter-spacing="2">RHYTHM GAME · DESKTOP · BY MICHAEL PYON</text>
